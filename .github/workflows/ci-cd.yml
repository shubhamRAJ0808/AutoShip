name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1) BUILD + TEST (npm) and smoke-test the Docker Compose stack
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Start web + database with Docker Compose
        run: docker compose up -d --build --wait
      - name: Smoke test
        run: |
          curl --fail http://localhost:3000/health
          curl --fail http://localhost:3000/
      - name: Stop containers
        if: always()
        run: docker compose down -v

  # 2) DOCKER: build the image and push it to GitHub Container Registry
  docker:
    needs: build-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}

  # 3) DEPLOY: SSH into a server and run docker compose
  #    Only runs when the repo variable DEPLOY_ENABLED is set to "true"
  deploy:
    needs: docker
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: docker-compose.yml
          target: ~/simple-cicd-app
      - name: Pull image and restart containers
        uses: appleboy/ssh-action@v1.0.3
        env:
          WEB_IMAGE: ${{ needs.docker.outputs.image }}:latest
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: WEB_IMAGE,GHCR_USER,GHCR_TOKEN,DB_PASSWORD
          script: |
            cd ~/simple-cicd-app
            printf "WEB_IMAGE=%s\nDB_PASSWORD=%s\n" "$WEB_IMAGE" "$DB_PASSWORD" > .env
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull web
            docker compose up -d
            docker image prune -f
